services:
  backend:
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../hrms:/home/frappe/frappe-bench/apps/hrms
    environment:
      PYTHONPATH: /home/frappe/frappe-bench/apps/hrms:/home/frappe/frappe-bench/apps/erpnext:/home/frappe/frappe-bench/apps/frappe

  queue-short:
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../hrms:/home/frappe/frappe-bench/apps/hrms
    environment:
      PYTHONPATH: /home/frappe/frappe-bench/apps/hrms:/home/frappe/frappe-bench/apps/erpnext:/home/frappe/frappe-bench/apps/frappe

  queue-long:
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../hrms:/home/frappe/frappe-bench/apps/hrms
    environment:
      PYTHONPATH: /home/frappe/frappe-bench/apps/hrms:/home/frappe/frappe-bench/apps/erpnext:/home/frappe/frappe-bench/apps/frappe

  scheduler:
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../hrms:/home/frappe/frappe-bench/apps/hrms
    environment:
      PYTHONPATH: /home/frappe/frappe-bench/apps/hrms:/home/frappe/frappe-bench/apps/erpnext:/home/frappe/frappe-bench/apps/frappe
